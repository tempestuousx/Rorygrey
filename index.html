<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rory Grey — Las Vegas, Nevada</title>
  <meta name="description" content="Rory Grey. Private appointments in Las Vegas and beyond." />
  <script>
    // Returning visitors skip the intro video (hidden before the page draws)
    try { if (localStorage.getItem("rg-intro-seen")) document.documentElement.classList.add("intro-seen"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css?v=38" />
  <link rel="stylesheet" href="win98.css?v=38" />
</head>
<body class="win98">
  <!-- Intro video: plays first, then fades into the desktop -->
  <div class="intro" id="intro">
    <video id="introVideo" src="video/intro.mp4" playsinline preload="auto"></video>
    <button class="intro-sound" id="introSound" type="button" hidden>&#128266; Tap for sound</button>
    <button class="intro-skip" id="introSkip" type="button">Skip &rsaquo;</button>
  </div>
  <!-- Menu bar -->
  <header class="menubar" role="banner">
    <div class="menubar-left">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-word">RORY GREY</span>
      <span class="brand-sub">LAS VEGAS, NEVADA</span>
    </div>
    <div class="menubar-right">
      <span class="mb-loc">LAS VEGAS, NV</span>
      <span class="mb-sep" aria-hidden="true">/</span>
      <span class="mb-clock" id="clock">—</span>
    </div>
  </header>

  <!-- Desktop canvas: icons injected by JS -->
  <main class="desktop" id="desktop" aria-label="Rory Grey desktop">
    <div class="wallmark" aria-hidden="true">
      <span class="wallmark-title">RORY<br>GREY</span>
      <span class="wallmark-foot">PRIVATE&nbsp;·&nbsp;BY&nbsp;DESIGN</span>
    </div>
    <div class="icon-layer" id="iconLayer"></div>
    <div class="window-layer" id="windowLayer"></div>
  </main>

  <!-- Dock -->
  <nav class="dock" id="dock" aria-label="Applications"></nav>

  <script src="app.js?v=38"></script>
</body>
</html>
